# Editable OpenExplorer S100 ONNX PTQ baseline. Inspect the live toolchain before use.
model_parameters:
  onnx_model: 'MODEL_PATH'
  march: 'nash-e'
  layer_out_dump: false
  working_dir: 'model_output'
  output_model_file_prefix: 'model_s100'
  # output_nodes: ''
  # node_info:
  #   NODE_NAME:
  #     ON: 'BPU'
  #     InputType: 'int16'
  #     OutputType: 'int16'
input_parameters:
  input_name: ''
  input_shape: ''
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  norm_type: 'no_preprocess'
  # input_layout_rt: 'NCHW'
  # mean_value: ''
  # scale_value: ''
  # std_value: ''
  # input_space_and_range: 'regular'
  # from_color: 'RGB'
  # to_color: 'YUV_BT601_FULL_RANGE'
calibration_parameters:
  cal_data_dir: 'calibration'
  cal_data_type: 'float32'
  calibration_type: 'default'
  # per_channel: false
  # max_percentile: 0.9999
  # quant_config:
  #   model_config:
  #     all_node_type: 'int8'
  #     activation:
  #       calibration_type: 'max'
  #   op_config:
  #     OP_TYPE:
  #       qtype: 'int16'
  #   node_config:
  #     NODE_NAME:
  #       qtype: 'int16'
compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O2'
  debug: false
  core_num: 1
  jobs: 8
  # balance_factor: 100
  # cache_mode: 'enable'
  # extra_params:
  #   input_no_padding: true
  #   output_no_padding: true
