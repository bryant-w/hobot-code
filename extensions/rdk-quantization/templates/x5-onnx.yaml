# Editable OpenExplorer X5 ONNX PTQ baseline. Inspect the live toolchain before use.
model_parameters:
  onnx_model: 'MODEL_PATH'
  march: 'bayes-e'
  layer_out_dump: false
  working_dir: 'model_output'
  output_model_file_prefix: 'model_x5'
input_parameters:
  input_name: ''
  input_shape: ''
  # Replace every CONTRACT_REQUIRED value from exact model/export/runtime evidence.
  input_type_rt: 'CONTRACT_REQUIRED'
  input_type_train: 'CONTRACT_REQUIRED'
  input_layout_train: 'CONTRACT_REQUIRED'
  norm_type: 'CONTRACT_REQUIRED'
  # mean_value: ''
  # scale_value: ''
  # std_value: ''
  # input_source: {'INPUT_NAME': 'pyramid'}
calibration_parameters:
  cal_data_dir: 'calibration'
  cal_data_type: 'float32'
  calibration_type: 'default'
  # per_channel: false
  # max_percentile: 0.9999
  # quant_config:
  #   model_config: {}
  #   op_config: {}
  #   node_config: {}
compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: false
  # core_num: 1
  # jobs: 8
  # advice: 1
  # extra_params: {}
